[package]
name = "agent-companion-desktop"
version = "0.1.0"
description = "Agent Companion — modular Agent OS for creators"
authors = ["Agent Companion contributors"]
edition = "2021"

[lib]
name = "agent_companion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"

