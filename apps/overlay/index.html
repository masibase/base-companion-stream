<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Companion Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: transparent;
        color: #e6e6ea;
      }
      .overlay {
        max-width: 480px;
        margin: 0 auto;
        padding: 1rem;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: #8b8b93;
        margin-bottom: 0.75rem;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff7b72;
      }
      #dot.on {
        background: #7fd1a0;
      }
      .card {
        background: rgba(26, 26, 33, 0.85);
        border: 1px solid #2a2a33;
        border-radius: 10px;
        padding: 0.6rem 0.9rem;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
      }
      .card p {
        margin: 0.3rem 0 0;
        color: #c8c8d0;
      }
      .tag {
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
        margin-right: 0.4rem;
      }
      .tag.chat {
        background: #2a3b52;
        color: #9dc7ff;
      }
      .tag.nova {
        background: #4a3b63;
        color: #d4b6ff;
      }
      .tag.sum {
        background: #3b5234;
        color: #b6ffa8;
      }
      .time {
        color: #6b6b73;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="status"><span id="dot"></span><span id="label">connecting…</span></div>
      <div id="feed"></div>
    </div>
    <script>
      const feed = document.getElementById("feed");
      const dot = document.getElementById("dot");
      const label = document.getElementById("label");

      function esc(value) {
        const div = document.createElement("div");
        div.textContent = String(value ?? "");
        return div.innerHTML;
      }

      function card(tagClass, tag, when, text) {
        const node = document.createElement("div");
        node.className = "card";
        node.innerHTML =
          `<span class="tag ${tagClass}">${tag}</span>` +
          `<span class="time">${when}</span><p>${text}</p>`;
        feed.prepend(node);
        while (feed.children.length > 50) feed.lastChild.remove();
      }

      const es = new EventSource("/events");
      es.onopen = () => {
        dot.classList.add("on");
        label.textContent = "live";
      };
      es.onerror = () => {
        dot.classList.remove("on");
        label.textContent = "reconnecting…";
      };
      es.onmessage = (ev) => {
        let e;
        try {
          e = JSON.parse(ev.data);
        } catch {
          return;
        }
        const when = new Date(e.ts).toLocaleTimeString();
        if (e.type === "chat.message") {
          card("chat", "chat", when, `<b>${esc(e.payload.user)}</b> ${esc(e.payload.text)}`);
        } else if (e.type === "response.ready") {
          card("nova", "nova", when, esc(e.payload.text));
        } else if (e.type === "summary.ready") {
          card(
            "sum",
            "summary",
            when,
            `${esc(e.payload.messageCount)} messages, ${esc(e.payload.uniqueUsers)} viewers`,
          );
        }
      };
    </script>
  </body>
</html>
